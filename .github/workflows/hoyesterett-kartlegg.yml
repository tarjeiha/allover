name: Kartlegg Høyesteretts avgjørelser (midlertidig)

# Midlertidig: prøver domstol.no og lovdata.no for Høyesteretts avgjørelser.
# Skriver bare til loggen. Fjernes før fletting.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/hoyesterett-kartlegg.yml"]

permissions:
  contents: read

jobs:
  kartlegg:
    runs-on: ubuntu-latest
    steps:
      - name: Kartlegg
        shell: python
        run: |
          import re, urllib.request
          UA = {"User-Agent": "allover-kartlegging (github.com/tarjeiha/allover)"}
          def hent(url, n=None):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60)
                  b = r.read(n) if n else r.read()
                  return r.status, r.headers.get("Content-Type", ""), b, r.geturl()
              except Exception as e:
                  return getattr(e, "code", str(e)), "", b"", url
          def tekst(b):
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", re.sub(r"(?s)<(script|style)[^>]*>.*?</\1>", " ", b.decode("utf-8", "replace"))))
          def vis(url, mønster=r".", n=60, utdrag=1500):
              s, ct, b, eff = hent(url)
              print(f"\n##### {s} {ct} {len(b)} {url} -> {eff}")
              t = b.decode("utf-8", "replace")
              lenker = sorted(set(re.findall(r'href="([^"#]+)"', t)))
              for m in [l for l in lenker if re.search(mønster, l, re.I)][:n]:
                  print("   ", m)
              if utdrag:
                  print("   TEKST:", tekst(b)[:utdrag])
              return t
          for u in ["https://www.domstol.no/robots.txt", "https://lovdata.no/robots.txt"]:
              s, ct, b, eff = hent(u)
              print(f"\n##### {s} {u}\n" + b.decode("utf-8", "replace")[:3000])
          s, ct, b, eff = hent("https://www.domstol.no/sitemap.xml")
          t = b.decode("utf-8", "replace")
          print("\n##### sitemap", s, len(t))
          print("\n".join(re.findall(r"<loc>([^<]+)</loc>", t)[:40]))
          print("hoyesterett-treff:", len(re.findall(r"hoyesterett", t)))
          vis("https://www.domstol.no/no/hoyesterett/", r"hoyesterett|avgj|pdf|praksis", 80)
          t = vis("https://www.domstol.no/no/hoyesterett/avgjorelser/", r"avgj|pdf|HR-|\?|side|page|20\d\d", 120, 3000)
          for m in sorted(set(re.findall(r'href="(/[^"]*avgjorelser/20\d\d[^"]*)"', t)))[:3]:
              vis("https://www.domstol.no" + m, r"avgj|pdf|HR-|\?|page", 60, 1500)
          for u in ["https://www.domstol.no/no/om-nettstedet/", "https://www.domstol.no/no/personvern/", "https://www.domstol.no/no/hoyesterett/om-hoyesterett/publisering-av-avgjorelser/"]:
              vis(u, r"vilk|lisens|gjenbruk|publiser|personvern", 30, 2500)
          vis("https://lovdata.no/register/hoyesterett", r"/dokument/H|/register/", 40, 1500)
          vis("https://lovdata.no/sok?q=HR-2025&filter=HRSIV", r"/dokument/", 20, 800)
          vis("https://lovdata.no/info/lisens", r"lisens|vilk", 20, 3000)
          vis("https://lovdata.no/info/vilkar", r"lisens|vilk", 20, 3000)

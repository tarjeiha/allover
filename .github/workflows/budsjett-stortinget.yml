name: Hent budsjettvedtak fra Stortinget

on:
  schedule:
    # Hver mandag kl. 05.15 UTC. Budsjettvedtakene kommer i desember (saldert), juni (RNB) og desember (nysaldering).
    - cron: "15 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: budsjett-stortinget
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Råfilene fra Stortinget mellomlagres, så bare nye sesjoner hentes på nytt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/stortinget
          key: stortinget-${{ github.run_id }}
          restore-keys: stortinget-

      - name: Hent og les vedtak
        run: python3 verktoy/stortinget_budsjett.py | tee "$RUNNER_TEMP/rapport.txt"

      - name: Legg inn på main
        run: |
          { echo "Budsjettvedtak fra Stortinget"; echo; cat "$RUNNER_TEMP/rapport.txt"; } > "$RUNNER_TEMP/melding.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budsjett
          git diff --cached --quiet && exit 0
          git commit -q -F "$RUNNER_TEMP/melding.txt"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1

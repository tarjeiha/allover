name: Hent budsjettvedtak fra Stortinget

on:
  schedule:
    # Hver mandag kl. 05.15 UTC. Budsjettvedtakene kommer i desember (saldert), juni (RNB) og desember (nysaldering).
    - cron: "15 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: budsjett-stortinget
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Råfilene fra Stortinget mellomlagres, så bare nye sesjoner hentes på nytt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/stortinget
          key: stortinget-${{ github.run_id }}
          restore-keys: stortinget-

      - name: Hent og les vedtak
        run: python3 verktoy/stortinget_budsjett.py | tee "$RUNNER_TEMP/rapport.txt"

      - name: Legg inn på main
        run: |
          { echo "Budsjettvedtak fra Stortinget"; echo; cat "$RUNNER_TEMP/rapport.txt"; } > "$RUNNER_TEMP/melding.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budsjett
          git diff --cached --quiet && exit 0
          git commit -q -F "$RUNNER_TEMP/melding.txt"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1

      - name: Varsle om feil
        if: failure()
        uses: ./.github/actions/driftsvarsel
        with:
          tittel: "Budsjettvedtak fra Stortinget: feil"
          tekst: "hentingen av budsjettvedtak fra Stortinget feilet. Se kjøringen, eller be Claude se på det."

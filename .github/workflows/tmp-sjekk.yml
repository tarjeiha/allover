name: tmp sjekk
on:
  push:
    branches: [claude/project-thread-nbcnhe]
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (regelverksbasen; tarjeiha/allover)"
          for u in https://www.statsbudsjettet.no/ https://www.statsbudsjettet.no/robots.txt https://www.statsbudsjettet.no/sitemap.xml; do
            echo "=== $u"; curl -sL -A "$A" -m 30 -o s.html -w "%{http_code} %{content_type} %{size_download} %{url_effective}\n" "$u"
            head -c 3000 s.html; echo
            grep -oiE 'href="[^"]*"' s.html | sort -u | head -150
          done
          echo "=== søk spørsmål"
          curl -sL -A "$A" -m 30 https://www.statsbudsjettet.no/ | grep -oiE '[^"<>]{0,80}(sp[øo]rsm[åa]l|svar)[^"<>]{0,80}' | head -40

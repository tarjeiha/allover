name: Sjekk håndskrevet tekst

on:
  # Merknader og veivisere skrives for hånd. Kontrollen fanger døde stier, utsagn om at
  # regelverk som er i basen, «ikke er i basen», og departementsnavn som avsender.
  pull_request:
    paths: ["regelverk/**", "regelverk.json", "verktoy/**", "skills/**", "sprak/**", "data/*.md", "stortinget/*.md", "budsjett/VEIVISER.md", "politikk/VEIVISER.md", "veiledere/VEIVISER.md", "innboks*/README.md", "*.md"]
  push:
    branches: [main]
    paths: ["regelverk/**", "regelverk.json", "verktoy/**", "skills/**", "sprak/**", "data/*.md", "stortinget/*.md", "budsjett/VEIVISER.md", "politikk/VEIVISER.md", "veiledere/VEIVISER.md", "innboks*/README.md", "*.md"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Sjekk merknader og veivisere
        shell: bash
        run: python3 verktoy/sjekk_tekst.py | tee "$RUNNER_TEMP/funn.txt"

      # Endringer kan komme rett på main fra en chat. Da er det ingen PR som stopper,
      # så et funn må gi en sak som blir sett.
      - name: Varsle om funn på main
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/driftsvarsel
        with:
          tittel: "Tekstkontrollen: funn på main"
          tekst: "tekstkontrollen fant feil i håndskrevet tekst på main, f.eks. døde stier eller et departementsnavn som avsender. Rett filene, eller be Claude se på det."
          fil: ${{ runner.temp }}/funn.txt

name: Vis robots.txt (midlertidig)

# Midlertidig: skriver robots.txt for regjeringen.no og udi.no til loggen. Fjernes før fletting.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/robots-kartlegg.yml"]

permissions:
  contents: read

jobs:
  vis:
    runs-on: ubuntu-latest
    steps:
      - name: Hent
        run: |
          for u in https://www.regjeringen.no/robots.txt https://www.udi.no/robots.txt; do
            echo "##### $u"
            curl -sS -m 60 -A "allover-kartlegging (github.com/tarjeiha/allover)" -o svar.txt -w "status %{http_code} %{content_type}\n" "$u"
            cat svar.txt | head -c 20000; echo
          done

name: Kartlegg UDI (midlertidig)

# Midlertidig: prøver sitemap og sider på udi.no og udiregelverk.no. Skriver bare til loggen. Fjernes før fletting.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/udi-kartlegg.yml"]

permissions:
  contents: read

jobs:
  kartlegg:
    runs-on: ubuntu-latest
    steps:
      - name: Kartlegg
        shell: python
        run: |
          import re, urllib.request, time
          from collections import Counter
          UA = {"User-Agent": "regelverksbase/1.0 (+https://github.com/tarjeiha/allover)"}
          def hent(url):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60)
                  return r.status, r.headers.get("Content-Type", ""), r.read(), r.geturl(), dict(r.headers)
              except Exception as e:
                  h = dict(getattr(e, "headers", {}) or {})
                  return getattr(e, "code", str(e)), "", (e.read() if hasattr(e, "read") else b""), url, h
              finally:
                  time.sleep(1)
          def sitemap(url, dybde=0):
              s, ct, b, eff, h = hent(url)
              t = b.decode("utf-8", "replace")
              print(f"  sitemap {s} {ct} {len(b)} {url} server={h.get('Server','')} cf={h.get('cf-ray','')}")
              if s != 200: print("   ", re.sub(r"\s+", " ", t)[:300]); return []
              if "<sitemapindex" in t and dybde < 2:
                  ut = []
                  for u in re.findall(r"<loc>\s*(.*?)\s*</loc>", t): ut += sitemap(u, dybde + 1)
                  return ut
              return re.findall(r"<url>.*?<loc>\s*(.*?)\s*</loc>(?:.*?<lastmod>\s*(.*?)\s*</lastmod>)?", t, re.S)
          for vert in ["https://www.udi.no", "https://www.udiregelverk.no", "https://udiregelverk.no"]:
              print(f"\n######## {vert}")
              s, ct, b, eff, h = hent(vert + "/robots.txt")
              print("robots", s, eff); print(b.decode("utf-8", "replace")[:1500])
              urls = sitemap(vert + "/sitemap.xml")
              print("adresser:", len(urls), "med lastmod:", sum(1 for _, m in urls if m))
              c = Counter("/".join(u.split("/")[:5]) for u, _ in urls)
              for k, v in c.most_common(25): print("  ", v, k)
              treff = [u for u, _ in urls if re.search(r"rundskriv|regelverk|RS-?20|/rs-|praksis|instruks|veiledning", u, re.I)]
              print("regelverkstreff:", len(treff)); [print("   ", u) for u in treff[:20]]
              for u in ([vert + "/"] + [u for u, _ in urls[:2]] + treff[:3]):
                  s, ct, b, eff, h = hent(u)
                  tittel = re.search(r"<title>(.*?)</title>", b.decode("utf-8", "replace"), re.S)
                  print(f"  side {s} {ct} {len(b)} {u} -> {eff} | {tittel.group(1).strip()[:100] if tittel else ''} | server={h.get('Server','')}")

name: NVA-kartlegging (midlertidig)
on:
  push:
    branches: [claude/project-thread-l50ud0]
    paths: [kartlegg/nva.py, .github/workflows/nva-kartlegg.yml]
permissions:
  contents: read
jobs:
  kartlegg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I kartlegg/nva.py

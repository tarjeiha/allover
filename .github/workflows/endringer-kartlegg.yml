name: Kartlegg vedtatte endringer (midlertidig)

# Midlertidig: finner ut hvorfor lov 12. juni 2026 nr. 24 (SPK-loven § 29) ikke varsles. Fjernes før fletting.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/endringer-kartlegg.yml"]

permissions:
  contents: read

jobs:
  kartlegg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.12.3 lxml==5.3.0
      - name: Kartlegg
        working-directory: verktoy
        shell: python
        run: |
          import re, tarfile, urllib.request, shutil
          from datetime import date
          from pathlib import Path
          from bs4 import BeautifulSoup
          import sys, os; sys.path.insert(0, os.getcwd())
          import endringer as E
          d = Path("/tmp/ld"); d.mkdir()
          for n in ["lovtidend-avd1-2026.tar.bz2", "gjeldende-lover.tar.bz2"]:
              with urllib.request.urlopen(E.API + n, timeout=600) as r, open(d / n, "wb") as f:
                  shutil.copyfileobj(r, f)
          MÅL = ["lov/2026-06-12-24"]
          for navn, raa in E._dokumenter([d / "lovtidend-avd1-2026.tar.bz2"]):
              soup = BeautifulSoup(raa.split("</header>")[0], "lxml")
              ref = E._dd(soup, "refid")
              tittel = E._dd(soup, "title")
              if ref in MÅL or re.search(r"pensjonskasse", tittel, re.I):
                  print("==", navn, ref, "|", tittel)
                  for c in ["legacyID", "dateInForce", "dateOfPublication", "miscInformation", "dokid"]:
                      print("  ", c, "=", repr(E._dd(soup, c)))
                  m = E.ENDRER.search(raa)
                  print("   endrer:", E.LI.findall(m.group(1)) if m else None)
                  full = BeautifulSoup(raa, "lxml")
                  for dc in full.find_all("article", class_="document-change"):
                      print("   document-change", dc.get("data-document"), [E._del(ch) + " -> " + str(E._paragraf(E._del(ch))) for ch in dc.find_all("article", class_="change")][:12])
                  akt = {"ref": ref, "ikraft": E._dd(soup, "dateInForce"), "tittel": tittel}
                  print("   status:", E._status(akt, [], date.today()))
          # Gjeldende SPK-lov
          with tarfile.open(d / "gjeldende-lover.tar.bz2", "r:bz2") as tar:
              for m in tar:
                  if not m.isfile(): continue
                  t = tar.extractfile(m).read().decode("utf-8", "replace")
                  if "Statens pensjonskasse" in t[:3000] and "lov/2026-06-12-24" in t:
                      p = d / "spk.xml"; p.write_text(t, encoding="utf-8")
                      print("== gjeldende", m.name, re.search(r'<dd class="dokid"[^>]*>\s*([^<\s]+)', t).group(1))
                      per, alle, sist = E._henvisninger(p)
                      print("   sist endret i kraft:", sist)
                      print("   i alle:", "lov/2026-06-12-24" in alle, [h for h in alle if "2026" in h])
                      for k, v in per.items():
                          if "lov/2026-06-12-24" in v or k in ("29", "par-29"):
                              print("   per_par", k, sorted(v)[-6:])
                      s = BeautifulSoup(t, "lxml")
                      for a in s.find_all("a", href=re.compile("2026-06-12-24")):
                          print("   lenke:", a.get("href"), "| forelder:", a.parent.name, a.parent.get("class"), "| tekst rundt:", a.parent.get_text(" ", strip=True)[:300])
                      h = s.find("header")
                      print("   header-tekst:", h.get_text(" | ", strip=True)[:1500] if h else None)

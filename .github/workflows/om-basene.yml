name: Oppdater oversikten over basene

on:
  schedule:
    # Hver dag kl. 06.30 UTC, etter de nattlige hentejobbene
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: om-basene
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lag oversikten
        run: python3 verktoy/om_basene.py

      - name: Lag driftsvarselet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 verktoy/driftsvarsel.py

      - name: Legg inn på main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OM-BASENE.md SKILLVERSJONER.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Oversikten over basene: oppdatert"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1

      - name: Varsle om feil
        if: failure()
        uses: ./.github/actions/driftsvarsel
        with:
          tittel: "Oversikten over basene: feil"
          tekst: "oppdateringen av OM-BASENE.md og driftsvarselet i SKILLVERSJONER.md feilet. Se kjøringen, eller be Claude se på det."

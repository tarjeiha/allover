name: Oppdater oversikten over basene

on:
  schedule:
    # Hver dag kl. 06.30 UTC, etter de nattlige hentejobbene
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: om-basene
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Lag oversikten
        run: python3 verktoy/om_basene.py

      - name: Legg inn på main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OM-BASENE.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Oversikten over basene: oppdatert"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1

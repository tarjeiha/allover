name: Oppdater oversikten over basene

on:
  schedule:
    # Hver dag kl. 06.30 UTC, etter de nattlige hentejobbene
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: om-basene
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Lag oversikten
        run: python3 verktoy/om_basene.py

      - name: Lag driftsvarselet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 verktoy/driftsvarsel.py

      - name: Legg inn på main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OM-BASENE.md SKILLVERSJONER.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Oversikten over basene: oppdatert"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1

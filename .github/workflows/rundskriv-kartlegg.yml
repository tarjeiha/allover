name: Kartlegg Navs rundskriv hos Lovdata

# Midlertidig: kartlegger hvilke av Navs rundskriv som finnes hos Lovdata. Endrer ingenting i basen.
on:
  push:
    branches: ["claude/**"]
    paths: ["verktoy/rundskriv_kartlegg.py", ".github/workflows/rundskriv-kartlegg.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kartlegg:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Kartlegg
        run: python3 verktoy/rundskriv_kartlegg.py | tee kartlegging.tsv

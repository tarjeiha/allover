name: Engangsinnlegging Stortinget (midlertidig)
on:
  push:
    branches: [claude/project-thread-nr3oez]
    paths: [.github/workflows/diag-stortinget.yml]
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Finn sak-id for eldre reformer
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, 'stortinget/scripts')
          from felles import hent_sesjon_xml, parse_saker_liste, t, NS
          for s in ['2008-2009', '2009-2010', '2010-2011', '2004-2005', '2005-2006']:
              for sak in parse_saker_liste(hent_sesjon_xml('saker', s)):
                  k = sak.find(NS + 'komite'); kid = t(k, 'id') if k is not None else ''
                  tit = (t(sak, 'tittel') or '')
                  if kid == 'ARBSOS' and any(w in tit.lower() for w in ('pensjon', 'uføre', 'arbeids- og velferd', 'nav')):
                      print(s, t(sak, 'id'), t(sak, 'dokumentgruppe'), t(sak, 'henvisning'), '|', tit[:150])
          PY
      - name: Saker og forslag fra 2011-2012
        run: python3 stortinget/scripts/komitesaker.py --fra 2011-2012
      - name: Statusoppdatering av eldre spørsmål
        run: python3 stortinget/scripts/backfill_sesjon.py | tail -3
      - name: Lagre på grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A stortinget/data
          git commit -q -m "Stortinget: saker og forslag fra arbeids- og sosialkomiteen fra 2011-2012"
          git push

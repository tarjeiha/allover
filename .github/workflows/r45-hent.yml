name: Hent Navs EØS-rundskriv (R45)

# Henter R45-00 fra Lovdata hver natt. Rundskrivet bygges på nytt bare når «Sist endret» hos Nav er ny.
on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      tving:
        description: "Bygg på nytt selv om «Sist endret» er uendret (ja/nei)"
        required: false
        default: "nei"

permissions:
  contents: write

concurrency:
  group: rundskriv
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pandoc
          pip install beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Hent og del opp R45
        env:
          TVING: ${{ inputs.tving }}
        run: |
          if [ "$TVING" = "ja" ]; then python3 verktoy/r45.py --tving; else python3 verktoy/r45.py; fi

      - name: Legg inn på main
        run: |
          [ -f r45-rapport.txt ] || exit 0
          mv r45-rapport.txt "$RUNNER_TEMP/melding.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -F "$RUNNER_TEMP/melding.txt"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1

      - name: Vis resultatet
        if: always()
        run: cat "$RUNNER_TEMP/melding.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "R45 er uendret." >> "$GITHUB_STEP_SUMMARY"

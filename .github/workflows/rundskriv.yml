name: Legg inn rundskriv fra innboksen

on:
  # Når noen legger en fil i innboks/ på main, legges den inn med en gang.
  push:
    branches: [main]
    paths: ["innboks/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rundskriv
  cancel-in-progress: false

jobs:
  rundskriv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils pandoc libreoffice-writer-nogui
          pip install beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Legg inn rundskriv
        run: python3 verktoy/rundskriv.py

      - name: Legg inn på main
        run: |
          [ -f rundskriv-rapport.txt ] || exit 0
          mv rundskriv-rapport.txt "$RUNNER_TEMP/melding.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -F "$RUNNER_TEMP/melding.txt"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1

      - name: Vis resultatet
        if: always()
        run: cat "$RUNNER_TEMP/melding.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Innboksen var tom." >> "$GITHUB_STEP_SUMMARY"

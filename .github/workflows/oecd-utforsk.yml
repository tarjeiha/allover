# Midlertidig: tester oecd_hent.py på grenen og legger tallene inn der. Slettes før PR.
on:
  push:
    branches: [claude/project-thread-6twhus]
    paths: [.github/workflows/oecd-utforsk.yml, verktoy/oecd_hent.py, data/oecd/pakke.json]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent
        run: python3 verktoy/oecd_hent.py || true
      - name: Vis
        run: |
          for f in data/oecd/*.tsv; do case "$f" in *.flagg.tsv) continue;; esac
            echo "=== $f $(wc -l < "$f") linjer $(du -k "$f" | cut -f1) kB"; grep '^#' "$f" | cut -c1-400; grep -v '^#' "$f" | head -4 | cut -c1-300; done
      - name: Legg inn på grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/oecd
          git diff --cached --quiet && exit 0
          git commit -qm "OECD: testhenting"
          git push

name: Hent nye Nav-filer

on:
  schedule:
    # Hver mandag kl. 05.00 UTC (07.00 norsk sommertid, 06.00 vintertid)
    - cron: "0 5 * * 1"
    # Hver tirsdag kl. 07.30 UTC (09.30 sommertid, 08.30 vintertid): Nav legger ut AAP-tall tirsdager kl. 08 norsk tid.
    # Ett tidspunkt etter publisering både sommer og vinter. Filer som allerede ligger inne, hoppes over.
    - cron: "30 7 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-innboks
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install openpyxl==3.1.5

      - name: Hent nye filer fra nav.no
        run: python3 verktoy/nav_hent.py || echo "HENTEFEIL=1" >> "$GITHUB_ENV"

      - name: Legg inn data
        run: python3 verktoy/data_innboks.py

      - name: Hent webtabeller fra nav.no
        run: python3 verktoy/nav_webtabell.py || echo "WEBFEIL=1" >> "$GITHUB_ENV"

      - name: Legg inn på main
        run: |
          if [ -f data-innboks-rapport.txt ]; then
            mv data-innboks-rapport.txt "$RUNNER_TEMP/melding.txt"
          else
            echo "Nav: oppdaterte sidedatoer" > "$RUNNER_TEMP/melding.txt"
            grep -qE "^Nav-webtabeller: [1-9]" nav-webtabell-rapport.txt 2>/dev/null && echo "Nav: oppdaterte webtabeller" > "$RUNNER_TEMP/melding.txt"
          fi
          if grep -qE "^Nav-webtabeller: [1-9]" nav-webtabell-rapport.txt 2>/dev/null; then
            { echo; cat nav-webtabell-rapport.txt; } >> "$RUNNER_TEMP/melding.txt"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -F "$RUNNER_TEMP/melding.txt"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1

      - name: Varsle om feil
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Egen sak for feil og for nye tabeller hos Nav, slik at «feil» bare brukes når noe faktisk feilet.
          sak() {
            tittel="$1"; tekst="$2"; fil="$3"
            [ -s "$fil" ] || return 0
            { echo "@tarjeiha: $tekst"; echo; cat "$fil"; } > "$RUNNER_TEMP/sak2.txt"
            nr=$(gh issue list --state open --search "\"$tittel\" in:title" --json number --jq '.[0].number')
            if [ -n "$nr" ]; then
              gh issue comment "$nr" --body-file "$RUNNER_TEMP/sak2.txt"
            else
              gh issue create --title "$tittel" --assignee tarjeiha --body-file "$RUNNER_TEMP/sak2.txt"
            fi
          }
          : > "$RUNNER_TEMP/feil.txt"
          grep -q "Ikke lagt inn" "$RUNNER_TEMP/melding.txt" 2>/dev/null && cat "$RUNNER_TEMP/melding.txt" >> "$RUNNER_TEMP/feil.txt"
          [ -n "$HENTEFEIL" ] && cat nav-hent-rapport.txt >> "$RUNNER_TEMP/feil.txt"
          [ -n "$WEBFEIL" ] && cat nav-webtabell-rapport.txt >> "$RUNNER_TEMP/feil.txt"
          sak "Nav-henting: feil" "den automatiske hentingen av Nav-filer stoppet på noe. Se under, eller be Claude se på det." "$RUNNER_TEMP/feil.txt"
          : > "$RUNNER_TEMP/nye.txt"
          if [ -z "$HENTEFEIL" ] && grep -qE "[1-9][0-9]* uten treff i kilder.json" nav-hent-rapport.txt 2>/dev/null; then
            sed -n '/^Filer på Navs sider som ikke står i kilder.json/,$p' nav-hent-rapport.txt >> "$RUNNER_TEMP/nye.txt"
          fi
          sak "Nav-henting: nye tabeller hos Nav" "hentingen gikk som den skulle, men Nav har lagt ut tabeller som ikke er satt opp for henting. De er ikke hentet. Be Claude legge dem til i data/nav/kilder.json hvis de skal være med." "$RUNNER_TEMP/nye.txt"

      - name: Vis resultatet
        if: always()
        run: |
          cat nav-hent-rapport.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat nav-webtabell-rapport.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat "$RUNNER_TEMP/melding.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

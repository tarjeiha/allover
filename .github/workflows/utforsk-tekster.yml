name: Test Nav-tekster (midlertidig)

on:
  push:
    branches: [claude/test-nav-tekster]
    paths: [verktoy/nav_tekster.py, .github/workflows/utforsk-tekster.yml]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-innboks
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent pressemeldinger fra nav.no
        run: python3 verktoy/nav_tekster.py --wayback || echo "TEKSTFEIL=1" >> "$GITHUB_ENV"

      - name: Legg inn på main
        run: |
          { echo "Nav: pressemeldinger"; echo; cat nav-tekster-rapport.txt; } > "$RUNNER_TEMP/melding.txt"
          rm -f nav-tekster-rapport.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/nav/tekster
          git diff --cached --quiet && exit 0
          git commit -q -F "$RUNNER_TEMP/melding.txt"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Vis resultatet
        if: always()
        run: cat "$RUNNER_TEMP/melding.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

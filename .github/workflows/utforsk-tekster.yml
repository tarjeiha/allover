name: Utforsk Nav-tekster (midlertidig)
on:
  push:
    branches: [claude/test-nav-tekster]
permissions:
  contents: read
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          echo "=== WAYBACK"
          curl -sL -m 120 "https://web.archive.org/cdx/search/cdx?url=www.nav.no/no/nav-og-samfunn/statistikk/&matchType=prefix&filter=original:.*/nyheter/.*&collapse=urlkey&fl=original,timestamp&limit=5000" -o wb.txt -w "%{http_code} %{size_download}\n"
          sed -E 's/[?#].*//; s#^http://#https://#; s#:80/#/#' wb.txt | awk '{print $1}' | sort -u > wb-urls.txt
          wc -l wb-urls.txt; cat wb-urls.txt | head -400
          echo "=== NEXT_DATA"
          curl -sL -A "$UA" https://www.nav.no/no/nav-og-samfunn/statistikk/aap-nedsatt-arbeidsevne-og-uforetrygd-statistikk/nyheter/veksten-i-aap-mottakere-flater-ut -o p.html
          python3 - <<'PY'
          import json,re
          t=open('p.html').read()
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',t,re.S)
          d=json.loads(m.group(1))
          c=d['props']['pageProps']['content']
          print('keys',list(c.keys()))
          for k in ('displayName','type','publish','createdTime','modifiedTime','language'):
              print(k, c.get(k))
          print('data keys', list((c.get('data') or {}).keys()))
          s=json.dumps(c.get('data'),ensure_ascii=False)
          print(s[:6000])
          PY
          echo "=== 2024-side"
          curl -sL -A "$UA" -o q.html -w "%{http_code}\n" https://www.nav.no/no/nav-og-samfunn/statistikk/aap-nedsatt-arbeidsevne-og-uforetrygd-statistikk/nyheter/11000-flere-aap-mottakere-siste-aar
          grep -o '"publish":{[^}]*}' q.html | head -2

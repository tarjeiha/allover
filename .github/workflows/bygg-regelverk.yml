name: Bygg regelverk fra Lovdata og EUR-Lex

on:
  # Når byggeverktøyet eller listen over regelverk endres på en bygg/-gren,
  # bygges lovteksten og legges inn på samme gren.
  push:
    branches: ["bygg/**"]
    paths: ["verktoy/**", "regelverk.json", ".github/workflows/bygg-regelverk.yml"]
  # Hver natt, og ved behov: bygg fra main og foreslå endringer som pull request.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: |
          pip install beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Sjekk Lovdatas åpne datasett
        run: curl -sS https://api.lovdata.no/v1/publicData/list | head -c 3000; echo

      - name: Bygg fra Lovdatas åpne datasett og EUR-Lex
        run: python3 verktoy/bygg.py

      # Bare til loggen: forskrifter med hjemmel i lovene som ikke er tatt med.
      - name: Forskrifter med hjemmel i lovene som ikke er med
        if: github.event_name == 'push' && !cancelled()
        continue-on-error: true
        run: python3 verktoy/finn_forskrifter.py --kilde .lovdata --alle

      # Tariffavtalene bygges av innboksen. Her åpnes bare en sak når det er tid for ny utgave.
      - name: Varsle om ny utgave av tariffavtalene
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 verktoy/avtale.py --varsle

      # Legges inn også når dekningskontrollen feiler, så feilene kan undersøkes
      # på grenen. Jobben er likevel rød, og grenen skal ikke flettes før den er grønn.
      - name: Legg inn på grenen
        if: github.event_name == 'push' && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ingen endringer i lovteksten."
          else
            git commit -q -m "Bygg lovtekst fra Lovdata"
            git push
          fi

      - name: Oppsummer endringene
        if: github.event_name != 'push'
        run: |
          git add -A
          python3 verktoy/byggoppsummering.py --ut "$RUNNER_TEMP/endringer.md"
          { echo "Automatisk bygget fra Lovdatas åpne datasett (NLOD 2.0)."; echo; cat "$RUNNER_TEMP/endringer.md"; } > "$RUNNER_TEMP/oppsummering.md"
          cat "$RUNNER_TEMP/oppsummering.md" >> "$GITHUB_STEP_SUMMARY"
          git reset -q

      - name: Foreslå oppdatering som pull request
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: bygg/lovdata-oppdatering
          commit-message: "Oppdater lovtekst fra Lovdata"
          title: "Oppdatert lovtekst fra Lovdata"
          body-path: ${{ runner.temp }}/oppsummering.md
          delete-branch: true

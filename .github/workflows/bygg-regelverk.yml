name: Bygg regelverk fra Lovdata

on:
  # Når byggeverktøyet eller listen over regelverk endres på en bygg/-gren,
  # bygges lovteksten og legges inn på samme gren.
  push:
    branches: ["bygg/**"]
    paths: ["verktoy/**", "regelverk.json", ".github/workflows/bygg-regelverk.yml"]
  # Hver natt, og ved behov: bygg fra main og foreslå endringer som pull request.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Bygg fra Lovdatas åpne datasett
        run: python3 verktoy/bygg.py

      # Legges inn også når dekningskontrollen feiler, så feilene kan undersøkes
      # på grenen. Jobben er likevel rød, og grenen skal ikke flettes før den er grønn.
      - name: Legg inn på grenen
        if: github.event_name == 'push' && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ingen endringer i lovteksten."
          else
            git commit -m "Bygg lovtekst fra Lovdata"
            git push
          fi

      - name: Foreslå oppdatering som pull request
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bygg/lovdata-oppdatering
          commit-message: "Oppdater lovtekst fra Lovdata"
          title: "Oppdatert lovtekst fra Lovdata"
          body: |
            Automatisk bygget fra Lovdatas åpne datasett (NLOD 2.0).

            Sjekk endringene i lov- og forskriftstekst før de tas inn.
          delete-branch: true

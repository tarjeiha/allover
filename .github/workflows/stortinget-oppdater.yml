name: Oppdater Stortinget

# Henter nye og endrede spørsmål, anmodningsvedtak og representantforslag fra data.stortinget.no
# for inneværende sesjon, og committer til main hvis noe er endret. Se stortinget/VEIVISER.md.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stortinget-oppdater
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent fra Stortinget
        run: |
          python3 stortinget/scripts/oppdater_inkrementell.py > "$RUNNER_TEMP/rapport.json"
          # I oktober og november kan forrige sesjon fortsatt få statusendringer (bortfalt, utfall)
          if [ "$(date +%m)" = "10" ] || [ "$(date +%m)" = "11" ]; then
            python3 stortinget/scripts/oppdater_inkrementell.py --sesjon forrige > "$RUNNER_TEMP/rapport-forrige.json"
            python3 stortinget/scripts/komitesaker.py --sesjon forrige > "$RUNNER_TEMP/komite-forrige.json"
          fi
          # Saker i arbeids- og sosialkomiteen, forslag fra voteringene og enkeltsaker fra enkeltsaker.txt
          python3 stortinget/scripts/komitesaker.py > "$RUNNER_TEMP/komite.json"

      - name: Legg inn på main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A stortinget/data
          git diff --cached --quiet && { echo "Ingen endringer fra Stortinget." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - "$RUNNER_TEMP/rapport.json" "$RUNNER_TEMP/komite.json" <<'PY'
          import json, sys, datetime
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          r.update(json.load(open(sys.argv[2], encoding="utf-8")))
          r["dato"] = datetime.date.today().isoformat()
          r.pop("dry_run", None)
          json.dump(r, open("stortinget/siste-oppdatering.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          # Nye saker og nye svar, til varselet om nye stortingssaker
          python3 stortinget/scripts/endringer.py
          git add stortinget/siste-oppdatering.json stortinget/siste-endringer.json
          git commit -q -m "Stortinget: oppdatering $(date +%F)"
          cat stortinget/siste-oppdatering.json >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1
